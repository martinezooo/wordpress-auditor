[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordpress-auditor"
version = "0.4.1"
description = "Evidence-gated WordPress and WooCommerce security audit CLI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wordpress-auditor = "wordpress_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["wordpress_auditor*"]
