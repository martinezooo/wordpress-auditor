[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordpress-auditor"
version = "0.1.0"
description = "Bounded, read-only WordPress and WooCommerce visibility auditor"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
wordpress-auditor = "wordpress_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["wordpress_auditor*"]
