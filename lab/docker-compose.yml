# Local-only WordPress lab for validating wordpress-auditor. Bound to 127.0.0.1.
# Throwaway credentials: never reuse them anywhere else.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: lab-only-db-pass
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: lab-only-db-pass
      WORDPRESS_DB_NAME: wp
    volumes:
      - wpdata:/var/www/html
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      - wordpress
    user: "33:33"
    volumes:
      - wpdata:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: lab-only-db-pass
      WORDPRESS_DB_NAME: wp
volumes:
  dbdata:
  wpdata:
